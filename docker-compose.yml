services:
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}      
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping","-h","localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - micro_net

  apigateway:
    build:
      context: .
      dockerfile: ./ApiGateway/Dockerfile
    ports:
      - "${APIGATEWAY_PORT}:8080"
    environment:
    - Jwt__Key=${JWT_KEY}
    - Jwt__Issuer=${JWT_ISSUER}
    depends_on:
      - mysql
      - rabbitmq
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - micro_net

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:        
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
    - micro_net

  adminservice:
    build:
      context: .
      dockerfile: ./AdminService.API/Dockerfile
    ports:
      - "${ADMIN_PORT}:8080"
    environment:
      # Database Connection String
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=admin_db;User=root;Password=${MYSQL_ROOT_PASSWORD}
     
      # JWT Settings
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      
      # Mailgun
      - MailSettings__ApiKey=${MAILGUN_API_KEY}
      - MailSettings__Domain=${MAILGUN_DOMAIN}
      - MailSettings__FromEmail=${MAILGUN_FROM}
      - MailSettings__FromName=SalesService

      # RabbitMQ Settings
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
    depends_on:
        mysql:
          condition: service_healthy
        rabbitmq:
          condition: service_healthy
        apigateway:
          condition: service_started
    networks:
      - micro_net   

  depotservice:
